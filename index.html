<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>MobiBard v5.3</title>
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="home.css?v=5.3.0&amp;rev=20260907-front-soundbank-stack1">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('mobibard.player.theme');
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <main class="home-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">MobiBard <span>v5.3</span></p>
        <h1 id="homeTitle">MobiBard</h1>
        <p class="hero-copy" id="homeSubtitle"></p>
      </div>
      <label class="language-control">
        <span id="languageLabel">언어</span>
        <select id="languageSelect" aria-label="언어">
          <option value="ko">한국어</option>
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
        </select>
      </label>
    </header>

    <section class="product-grid" id="productGrid" aria-label="MobiBard products"></section>

    <section class="soundfont-card" aria-labelledby="soundfontTitle">
      <div class="soundfont-copy">
        <p class="soundfont-kicker" id="soundfontKicker"></p>
        <h2 id="soundfontTitle"></h2>
        <p class="soundfont-description" id="soundfontDescription"></p>
        <p class="soundfont-license" id="soundfontLicense"></p>
      </div>
      <div class="soundfont-actions">
        <a class="soundfont-link" id="soundfontLicenseLink" href="assets/MobiBard_Instruments_LICENSE.txt"></a>
        <a class="soundfont-link primary" id="soundfontDownloadSf3" href="assets/MobiBard_Instruments.sf3" download="MobiBard_Instruments.sf3"></a>
        <a class="soundfont-link primary" id="soundfontDownloadDls" href="assets/MobiBard_Instruments.dls" download="MobiBard_Instruments.dls"></a>
      </div>
    </section>

    <footer class="home-footer">
      <span>© MobiBard</span>
      <span id="footerText"></span>
    </footer>
  </main>
  <script src="home.js?v=5.3.0&amp;rev=20260907-front-soundbank-stack1"></script>
</body>
</html>
