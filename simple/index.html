  <script>
  (() => {
    "use strict";
    const files = { ko: "ko.js", ja: "ja.js", en: "en.js", "zh-CN": "zh-CN.js", "zh-TW": "zh-TW.js" };
    const htmlLang = { ko: "ko", ja: "ja", en: "en", "zh-CN": "zh-Hans", "zh-TW": "zh-Hant" };
    const normalize = value => {
      const raw = String(value || "").trim().replace(/_/g, "-").toLowerCase();
      if (raw === "ko" || raw.startsWith("ko-")) return "ko";
      if (raw === "ja" || raw.startsWith("ja-")) return "ja";
      if (raw === "en" || raw.startsWith("en-")) return "en";
      if (["zh-tw", "zh-hk", "zh-mo", "zh-hant"].includes(raw) || raw.startsWith("zh-hant-")) return "zh-TW";
      if (raw === "zh" || raw.startsWith("zh-")) return "zh-CN";
      return "";
    };
    let language = "";
    try {
      const params = new URL(location.href).searchParams;
      for (const key of ["lang", "language", "locale"]) {
        if (!params.has(key)) continue;
        const raw = String(params.get(key) || "").trim();
        language = !raw || /^(?:auto|browser|system)$/i.test(raw) ? "" : (normalize(raw) || "en");
        break;
      }
    } catch (_) {}
    if (!language) {
      try { language = normalize(localStorage.getItem("mobibard.player.language")); } catch (_) {}
    }
    if (!language) {
      const candidates = Array.isArray(navigator.languages) && navigator.languages.length ? navigator.languages : [navigator.language || ""];
      for (const candidate of candidates) {
        language = normalize(candidate);
        if (language) break;
      }
    }
    language = files[language] ? language : "en";
    document.documentElement.lang = htmlLang[language] || "en";
    const localeUrl = new URL(`locale/${files[language]}`, document.baseURI);
    if (localeUrl.protocol !== "file:") {
      localeUrl.searchParams.set("v", "5.0.0");
      localeUrl.searchParams.set("rev", "20260818-211321");
    }
    document.write(`<script src="${localeUrl.href.replace(/&/g, "&amp;")}"><\/script>`);
  })();
  </script>
